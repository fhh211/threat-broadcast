name: Automatically crawl CVEs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'   # UTC 每3小时 → 北京时间 08/11/14/17/20/23/02/05 点整

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure pip caching
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # 0.3.0 硬依赖 aiohttp==3.6.2，其 asyncio.coroutines._DEBUG 在 py3.10+ 已移除
          # 升级到 0.4.3（API 兼容 GraphqlClient/execute）+ 新版 aiohttp，规避 import 崩溃
          python -m pip install --upgrade "python-graphql-client==0.4.3" "aiohttp>=3.9"

      # -g 传项目内置启动密码，避免 CRAWL_PWD 未配置导致 main.py 直接 exit(0)
      # --gtk 仅用于触发「写 cache 文件」模式；配了 GRAPAQL_TOKEN 就用，没配用占位值
      #   （原版 owner 硬编码指向上游 Issues，fork 后会给原作者订阅者群发，故不依赖它决定收件人）
      - name: Crawl CVEs
        run: python main.py -g 3uJtWFf4Vx1S2dSQXJCK --gtk "${{ secrets.GRAPAQL_TOKEN || 'ci' }}"

      # 收件人由 MAIL_RECEIVER Secret 指定；正则清洗为纯邮箱、逗号分隔，避免 QQ 报 501 Bad address syntax
      - name: Set receivers
        env:
          RECEIVERS: ${{ secrets.MAIL_RECEIVER }}
        run: |
          if [ -z "$RECEIVERS" ]; then echo "::error::MAIL_RECEIVER secret 未配置"; exit 1; fi
          # 仅保留 xxx@yyy.zzz 形式的合法邮箱，去掉显示名/尖括号/空格/中文逗号/分号等
          CLEAN=$(printf '%s' "$RECEIVERS" | grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' | sort -u | paste -sd, -)
          if [ -z "$CLEAN" ]; then echo "::error::MAIL_RECEIVER 中未找到合法邮箱（原值长度 ${#RECEIVERS}）"; exit 1; fi
          printf '%s' "$CLEAN" > cache/mail_recvs.dat
          echo "收件人已清洗写入：${CLEAN}"

      # main.py 写入 cache/mail_content.dat 后，由此步骤读取并以 HTML 发送
      - name: Send mail
        if: ${{ github.event_name != 'pull_request' }}
        uses: lyy289065406/action-send-mail@master
        with:
          server_address: ${{ secrets.MAIL_SMTP }}
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          from: ${{ secrets.MAIL_USER }}
          to: file://cache/mail_recvs.dat
          body: file://cache/mail_content.dat
          content_type: text/html
          subject: 威胁情报播报

      - name: Commit and push Github page (if changed)
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config --global user.email "github-bot@example.com"
          git config --global user.name "Github-Bot"
          git add -A
          git commit -m "Updated by Github Bot" || exit 0
          git push origin master
